services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobsmith
      POSTGRES_PASSWORD: jobsmith
      POSTGRES_DB: jobsmith
    ports:
      - "5432:5432"
    volumes:
      - jobsmith_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsmith -d jobsmith"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  jobsmith_postgres_data:
